name: AL Language Test Suite

# Runs the full AL language coverage suite against a real BC Cloud sandbox on
# every BC minor from 27.0 to 28.4 — the same floor and ceiling AL Runner's own
# matrix enforces, so a green verdict here means what a consumer needs it to mean.
# All matrix legs boot BC on Linux (no Windows runner required) via
# StefanMaron/MsDyn365Bc.On.Linux.
#
# Adding a new BC version:
#   1. In the prepare job, add an include entry to the else-branch JSON:
#      {"bc_version":"29.0","preprocessor_symbols":"BC27PLUS,BC28PLUS,BC29PLUS"}
#   2. If new API/keywords only exist from that version, guard tests with
#      #if BC29PLUS and define the symbol in the include entry above.
#   al_tool_version and runtime_version are auto-derived from bc_version
#   by the bc-linux reusable workflow — no manual entry needed.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bc_version:
        description: 'Override BC version (e.g. 28.1). Runs only that version when set.'
        required: false
        default: ''

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          OVERRIDE='${{ github.event.inputs.bc_version }}'
          if [ -n "$OVERRIDE" ]; then
            MAJOR=$(echo "$OVERRIDE" | cut -d. -f1)
            SYMS=""
            for v in 27 28; do
              [ "$v" -le "$MAJOR" ] || break
              SYMS="${SYMS:+$SYMS,}BC${v}PLUS"
            done
            JSON=$(python3 -c "import json; print(json.dumps({'include':[{'bc_version':'$OVERRIDE','preprocessor_symbols':'$SYMS'}]}))")
          else
            JSON='{"include":[{"bc_version":"27.0","preprocessor_symbols":"BC27PLUS"},{"bc_version":"27.3","preprocessor_symbols":"BC27PLUS"},{"bc_version":"27.5","preprocessor_symbols":"BC27PLUS"},{"bc_version":"28.0","preprocessor_symbols":"BC27PLUS,BC28PLUS"},{"bc_version":"28.1","preprocessor_symbols":"BC27PLUS,BC28PLUS"},{"bc_version":"28.2","preprocessor_symbols":"BC27PLUS,BC28PLUS"},{"bc_version":"28.3","preprocessor_symbols":"BC27PLUS,BC28PLUS"},{"bc_version":"28.4","preprocessor_symbols":"BC27PLUS,BC28PLUS"}]}'
          fi
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"

  test:
    name: BC ${{ matrix.bc_version }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: StefanMaron/MsDyn365Bc.On.Linux/.github/workflows/bc-test-from-source.yml@master
    with:
      bc_version:           ${{ matrix.bc_version }}
      bc_country:           "w1"
      app_dirs:             "tests/al-language-internals-fixture"
      test_app_dirs:        "tests/al-language"
      codeunit_range:       "60000..60999"
      preprocessor_symbols: ${{ matrix.preprocessor_symbols }}

    # Optional: supply a base64-encoded BC developer license.
    # Without this, BC boots with the public Cronus license (sufficient
    # for all language coverage tests — no ISV app IDs needed).
    #   base64 -w0 < your.bclicense | gh secret set BC_LICENSE
    # secrets:
    #   bc_license: ${{ secrets.BC_LICENSE }}
