name: AL Language Test Suite

# Runs the full AL language coverage suite against a real BC Cloud sandbox on
# every BC minor from 27.0 to 28.4 — the same floor and ceiling AL Runner's own
# matrix enforces, so a green verdict here means what a consumer needs it to mean.
# All matrix legs boot BC on Linux (no Windows runner required) via
# StefanMaron/MsDyn365Bc.On.Linux.
#
# Adding a new BC version:
#   1. In the prepare job, add an include entry to the else-branch JSON:
#      {"bc_version":"29.0","preprocessor_symbols":"BC27PLUS,BC28PLUS,BC29PLUS"}
#   2. If new API/keywords only exist from that version, guard tests with
#      #if BC29PLUS and define the symbol in the include entry above.
#   al_tool_version and runtime_version are auto-derived from bc_version
#   by the bc-linux reusable workflow — no manual entry needed.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bc_version:
        description: 'Override BC version (e.g. 28.1). Runs only that version when set.'
        required: false
        default: ''

# Supersede a run that no longer answers a question anyone is asking.
#
# WHY. This workflow had no concurrency control at all, so every push queued a fresh eight-leg
# matrix and nothing ever cancelled the one it replaced. Measured on 2026-09-05: four PRs merged
# in a row started four full master runs, none superseded — 32 legs where 8 would do. Three had
# to be cancelled by hand. GitHub Actions concurrency is per ACCOUNT, not per repository, so
# those legs also sit in front of StefanMaron/BusinessCentral.AL.Runner's own matrix.
#
# THE GROUP KEY includes the event name as well as the ref, which is one step beyond the usual
# `workflow-ref` pairing, and it is load-bearing here rather than decorative:
#
#   * pull_request  -> refs/pull/<n>/merge, already unique per PR.
#   * push          -> refs/heads/master. This is the project's health check: a green master run
#                      is the signal that the corpus still matches what a real BC service tier
#                      does, and AL Runner's autonomous cycle reads it as exactly that.
#   * workflow_dispatch on master would otherwise share the push group and could CANCEL that
#     health-check run. A manual dispatch is normally someone bisecting a red master with the
#     bc_version override; killing the automatic run to serve it, or the reverse, loses the one
#     answer that was wanted. Separating them keeps both.
#
# CANCEL-IN-PROGRESS IS TRUE FOR MASTER TOO, and that is a real trade, stated plainly: with
# four merges in a row only the last master run finishes, so a red leg says "one of the last few
# merges did it" rather than naming one. Three things make that the better deal here:
#
#   * The verdict it replaces did not exist. Queued behind an account-wide backlog, those runs
#     report on a tree nobody has any more — the state this repository was actually in a few
#     minutes before this file changed.
#   * The one cross-PR interaction that genuinely escapes per-PR CI — two PRs declaring the same
#     object id — is checked DIRECTLY by the object-ids job below, per PR against every other
#     open PR and again as an advisory sweep on master. That gate does not depend on per-commit
#     master runs. (Worth being honest about the limit: this repository does not require branches
#     to be up to date, so a PR's green is not a guarantee about master for anything the object-id
#     check does not cover.)
#   * Recovering the per-commit answer costs one workflow_dispatch on a branch pointing at the
#     suspect commit — precisely the run the group key above protects from the next merge.
#
# This changes no job's `if:` and adds no skips. The eight `BC <version> / test` legs are this
# repository's required status contexts; a cancelled run reports them as cancelled, never as
# skipped, so a superseded run can never satisfy a required check. ci.yml is the only workflow
# registered here (the object-id gate is a job inside it), so this block covers everything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  object-ids:
    # Fast gate, seconds not minutes: two PRs can each declare the SAME object id,
    # each compile green in isolation, and break master the moment both merge --
    # neither PR's own CI can see the other. Branch protection's "require branches
    # to be up to date" used to catch that as a side effect, by forcing the second
    # PR to be rebased onto the first and recompiled. This checks it directly, so
    # that setting is no longer load-bearing and corpus PRs need not be serialized.
    name: Object IDs must be unique and in range
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The cross-PR step below needs master's history to work out which ids
          # each PR actually INTRODUCES, as opposed to inherits.
          fetch-depth: 0

      # Proves the cross-PR detector still detects. Its interesting path only
      # fires when two open PRs genuinely collide, which is rare, so without
      # this it would report "no collisions" whether or not it still worked.
      - name: Self-test the cross-PR detector
        run: python3 .github/scripts/test-cross-pr-object-ids.py

      # This tree against master, and against itself.
      - run: python3 .github/scripts/check-object-ids.py .

      # This PR against every OTHER open PR. Blocking: two PRs that each add the
      # same id both pass the step above, and break master on the second merge.
      - name: Cross-PR object id collisions
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --quiet origin \
            +refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}
          BASE_REF=origin/${{ github.event.pull_request.base.ref }} \
            python3 .github/scripts/check-cross-pr-object-ids.py

      # Every open PR against every other, after master moved. NON-blocking on
      # purpose: a collision between two open PRs is not this merge commit's
      # fault, and a red master costs more than the annotation is worth. It runs
      # here so the collision is visible even when neither PR pushes again.
      - name: Cross-PR object id collisions (advisory sweep)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --no-tags --quiet origin \
            +refs/heads/${{ github.ref_name }}:refs/remotes/origin/${{ github.ref_name }} || true
          BASE_REF=origin/${{ github.ref_name }} \
            python3 .github/scripts/check-cross-pr-object-ids.py

  prepare:
    # Gated on object-ids so a duplicate/out-of-range id never spends the BC matrix.
    # An id collision does eventually surface as AL0297 inside each leg, but that is
    # 8 parallel BC boots and ~8 minutes per leg to learn something a 2-second scan
    # already knows. Failing here means the matrix is never dispatched at all.
    needs: object-ids
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          OVERRIDE='${{ github.event.inputs.bc_version }}'
          if [ -n "$OVERRIDE" ]; then
            MAJOR=$(echo "$OVERRIDE" | cut -d. -f1)
            SYMS=""
            for v in 27 28; do
              [ "$v" -le "$MAJOR" ] || break
              SYMS="${SYMS:+$SYMS,}BC${v}PLUS"
            done
            JSON=$(python3 -c "import json; print(json.dumps({'include':[{'bc_version':'$OVERRIDE','preprocessor_symbols':'$SYMS'}]}))")
          else
            JSON='{"include":[{"bc_version":"27.0","preprocessor_symbols":"BC27PLUS"},{"bc_version":"27.3","preprocessor_symbols":"BC27PLUS"},{"bc_version":"27.5","preprocessor_symbols":"BC27PLUS"},{"bc_version":"28.0","preprocessor_symbols":"BC27PLUS,BC28PLUS"},{"bc_version":"28.1","preprocessor_symbols":"BC27PLUS,BC28PLUS"},{"bc_version":"28.2","preprocessor_symbols":"BC27PLUS,BC28PLUS"},{"bc_version":"28.3","preprocessor_symbols":"BC27PLUS,BC28PLUS"},{"bc_version":"28.4","preprocessor_symbols":"BC27PLUS,BC28PLUS"}]}'
          fi
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"

  test:
    name: BC ${{ matrix.bc_version }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    # TEMPORARY, DO NOT MERGE: pinned to the branch under verification for
    # StefanMaron/MsDyn365Bc.On.Linux#<pr>. Restore @master before merging.
    uses: StefanMaron/MsDyn365Bc.On.Linux/.github/workflows/bc-test-from-source.yml@agent/impl-27/codeunit-ids-2048-batching
    with:
      bc_version:           ${{ matrix.bc_version }}
      bc_country:           "w1"
      app_dirs:             "tests/al-language-internals-fixture"
      test_app_dirs:        "tests/al-language"
      codeunit_range:       "60000..60999"
      preprocessor_symbols: ${{ matrix.preprocessor_symbols }}
      # TEMPORARY, DO NOT MERGE: the scripts checkout is a separate ref from the
      # workflow file, so pinning `uses:` alone still runs master's run-tests.sh.
      bc_linux_ref:         "agent/impl-27/codeunit-ids-2048-batching"

    # Optional: supply a base64-encoded BC developer license.
    # Without this, BC boots with the public Cronus license (sufficient
    # for all language coverage tests — no ISV app IDs needed).
    #   base64 -w0 < your.bclicense | gh secret set BC_LICENSE
    # secrets:
    #   bc_license: ${{ secrets.BC_LICENSE }}
